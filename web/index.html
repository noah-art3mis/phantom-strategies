<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0d" />
    <meta
      name="description"
      content="Philosophical advice generated with fine-tuned language models."
    />
    <title>Prophetic Strategies</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip" href="#oracle">Skip to the oracle</a>
    <header class="nav shell">
      <button
        type="button"
        id="motion-toggle"
        class="motion-toggle"
        aria-pressed="false"
      >
        Pause motion <span aria-hidden="true">Ⅱ</span>
      </button>
    </header>
    <main>
      <section class="hero shell" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">
            Prophetic<br /><span class="spectral-text">Strategies</span>
          </h1>
        </div>
        <div class="apparition" aria-hidden="true">
          <div class="aura"></div>
          <div id="spectral-scene"></div>
        </div>
      </section>
      <section id="oracle" class="oracle shell" aria-labelledby="oracle-title">
        <div class="oracle-heading">
          <h2 id="oracle-title">What is it that you desire?</h2>
        </div>
        <form id="consult-form">
          <fieldset id="voice-options">
            <legend>Choose a strategy</legend>
            <div class="voices">
              <label class="voice"
                ><input
                  type="radio"
                  name="strategy"
                  value="Ficticious"
                  checked
                /><span class="voice-name">Ficticious</span
                ><span class="voice-author">Jacques Lacan</span
                ><span class="voice-book">Seminar Book V</span></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Chimerical" /><span
                  class="voice-name"
                  >Chimerical</span
                ><span class="voice-author">Rudolf Steiner</span
                ><span class="voice-book"
                  >An Outline of Occult Science</span
                ></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Spectral" /><span
                  class="voice-name"
                  >Spectral</span
                ><span class="voice-author">G. W. F. Hegel</span
                ><span class="voice-book">Philosophy of Mind</span></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Quixotic" /><span
                  class="voice-name"
                  >Quixotic</span
                ><span class="voice-author">Marcus Aurelius</span
                ><span class="voice-book">Meditations</span></label
              >
            </div>
          </fieldset>
          <div class="question-box">
            <label class="sr-only" for="question">Your question</label
            ><textarea
              id="question"
              name="question"
              maxlength="2000"
              rows="2"
              required
              placeholder="Type your question…"
            ></textarea
            ><span class="question-count"
              ><output id="question-count" for="question">0</output> /
              2000</span
            >
          </div>
          <div class="form-bottom">
            <details class="temperature">
              <summary>Temperature</summary>
              <output id="temperature-value" for="temperature">1.0</output>
              <label for="temperature" class="sr-only">Temperature</label>
              <input
                id="temperature"
                name="temperature"
                type="range"
                min="0"
                max="1"
                step="0.1"
                value="1"
                aria-describedby="temperature-help"
              />
              <p id="temperature-help">Lower is steadier. Higher wanders.</p>
            </details>
            <button class="summon" type="submit">
              <span id="submit-label">O, Prophet...</span
              ><span aria-hidden="true">↗</span>
            </button>
          </div>
          <p id="form-error" class="error" role="alert" hidden></p>
        </form>
        <section
          id="response"
          class="response"
          aria-labelledby="response-title"
          aria-busy="false"
          hidden
        >
          <div class="response-header">
            <h3 id="response-title">Response</h3>
            <span id="response-status" role="status"></span>
          </div>
          <div
            id="loading-lines"
            class="loading-lines"
            aria-hidden="true"
            hidden
          >
            <i></i><i></i><i></i>
          </div>
          <p id="answer"></p>
          <p id="attribution"></p>
          <p id="reference" class="reference"></p>
          <p id="fiction-note" class="fiction-note" hidden>
            The response and its book reference are imagined, not quotations.
          </p>
        </section>
      </section>
    </main>
    <footer class="shell">
      <p>Made by Gustavo Costa</p>
      <div>
        <a href="https://github.com/noah-art3mis/phantom-strategies"
          >GitHub ↗</a
        >
        <a href="https://simulacro.co.uk/">Blog ↗</a
        ><a href="https://www.linkedin.com/in/gustavoarcos/">LinkedIn ↗</a
        ><a href="https://www.instagram.com/simulacro.psi/">Instagram ↗</a>
      </div>
    </footer>
    <noscript
      ><p class="noscript">
        Enable JavaScript to consult the oracle.
      </p></noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
