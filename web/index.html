<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0d" />
    <meta
      name="description"
      content="Speak with the ghosts of philosophy, conjured through fine-tuned language models."
    />
    <title>Prophetic Strategies</title>
    <link rel="canonical" href="https://prophetic.simulacro.tech/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prophetic Strategies" />
    <meta property="og:title" content="Prophetic Strategies" />
    <meta
      property="og:description"
      content="Speak with the ghosts of philosophy, conjured through fine-tuned language models."
    />
    <meta property="og:url" content="https://prophetic.simulacro.tech/" />
    <meta property="og:image" content="https://prophetic.simulacro.tech/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Prophetic Strategies, in large letters beside an iridescent apparition"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <a class="skip" href="#oracle">Skip to the oracle</a>
    <main>
      <section class="hero shell" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">
            Prophetic<br /><span class="spectral-text">Strategies</span>
          </h1>
        </div>
        <div class="apparition" aria-hidden="true">
          <div class="aura"></div>
          <div id="spectral-scene"></div>
        </div>
      </section>
      <section id="oracle" class="oracle shell" aria-labelledby="oracle-title">
        <div class="oracle-heading">
          <h2 id="oracle-title">What is it that you desire?</h2>
        </div>
        <form id="consult-form">
          <fieldset id="voice-options">
            <legend>Choose a strategy</legend>
            <div class="voices">
              <label class="voice"
                ><input
                  type="radio"
                  name="strategy"
                  value="Ficticious"
                  checked
                /><span class="voice-name">Ficticious</span
                ><span class="voice-author">Jacques Lacan</span
                ><span class="voice-book">Seminar Book V</span></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Chimerical" /><span
                  class="voice-name"
                  >Chimerical</span
                ><span class="voice-author">Rudolf Steiner</span
                ><span class="voice-book"
                  >An Outline of Occult Science</span
                ></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Spectral" /><span
                  class="voice-name"
                  >Spectral</span
                ><span class="voice-author">G. W. F. Hegel</span
                ><span class="voice-book">Philosophy of Mind</span></label
              >
              <label class="voice"
                ><input type="radio" name="strategy" value="Quixotic" /><span
                  class="voice-name"
                  >Quixotic</span
                ><span class="voice-author">Marcus Aurelius</span
                ><span class="voice-book">Meditations</span></label
              >
            </div>
          </fieldset>
          <div class="question-box">
            <label class="sr-only" for="question">Your question</label
            ><textarea
              id="question"
              name="question"
              maxlength="2000"
              rows="2"
              required
              placeholder="Type your question…"
            ></textarea>
          </div>
          <div class="form-bottom">
            <button class="summon" type="submit">
              <span id="submit-label">O, Prophet...</span>
            </button>
          </div>
          <p id="form-error" class="error" role="alert" hidden></p>
        </form>
        <section
          id="response"
          class="response"
          aria-labelledby="response-title"
          aria-busy="false"
          hidden
        >
          <div class="response-header">
            <h3 id="response-title">Response</h3>
            <span id="response-status" role="status"></span>
          </div>
          <div
            id="loading-lines"
            class="loading-lines"
            aria-hidden="true"
            hidden
          >
            <i></i><i></i><i></i>
          </div>
          <p id="answer"></p>
          <p id="attribution"></p>
          <p id="reference" class="reference"></p>
          <p id="fiction-note" class="fiction-note" hidden>
            The response and its book reference are imagined, not quotations.
          </p>
        </section>
      </section>
    </main>
    <footer class="shell">
      <p>Made by <a href="https://simulacro.tech/">simulacro.tech</a></p>
      <div>
        <a href="https://github.com/noah-art3mis/phantom-strategies">GitHub</a>
        <a href="https://simulacro.co.uk/">Blog</a
        ><a href="https://www.linkedin.com/in/gustavoarcos/">LinkedIn</a
        ><a href="https://www.instagram.com/simulacro.psi/">Instagram</a>
      </div>
      <button
        type="button"
        id="motion-toggle"
        class="motion-toggle"
        aria-pressed="false"
      >
        Pause motion <span aria-hidden="true">Ⅱ</span>
      </button>
    </footer>
    <noscript
      ><p class="noscript">
        Enable JavaScript to consult the oracle.
      </p></noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
